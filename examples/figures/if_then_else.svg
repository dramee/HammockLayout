<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="392" height="628" viewBox="0 0 392.000000 628.000000" role="img">
  <title>Ветвление if/else</title>
  <desc>Граф потока управления. Цветные рамки показывают гамаки, пунктирные стрелки показывают обратные дуги.</desc>
  <rect x="0" y="0" width="392" height="628" rx="0" fill="#ffffff" stroke="none" />
  <defs>
    <marker id="forward-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="#42536a" />
    </marker>
    <marker id="back-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="#a54128" />
    </marker>
  </defs>
  <g>
    <rect x="28" y="28" width="352" height="588" rx="9" fill="#f2f6fe" stroke="#35577a" />
    <rect x="56" y="232" width="296" height="180" rx="9" fill="#f3faf5" stroke="#32664e" />
  </g>
  <g fill="none" stroke-width="1.3999999999999999" stroke-linejoin="round">
    <polyline points="204.000000,92.000000 204.000000,100.000000 204.000000,136.000000 204.000000,144.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
    <polyline points="204.000000,180.000000 204.000000,188.000000 338.000000,224.000000 338.000000,232.000000 338.000000,252.000000 204.000000,252.000000 204.000000,260.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
    <polyline points="204.000000,296.000000 204.000000,304.000000 272.000000,340.000000 272.000000,348.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
    <polyline points="204.000000,296.000000 204.000000,304.000000 136.000000,340.000000 136.000000,348.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
    <polyline points="272.000000,384.000000 272.000000,392.000000 338.000000,392.000000 338.000000,412.000000 338.000000,420.000000 204.000000,456.000000 204.000000,464.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
    <polyline points="136.000000,384.000000 136.000000,392.000000 338.000000,392.000000 338.000000,412.000000 338.000000,420.000000 204.000000,456.000000 204.000000,464.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
    <polyline points="204.000000,500.000000 204.000000,508.000000 204.000000,544.000000 204.000000,552.000000" stroke="#42536a" marker-end="url(#forward-arrow)" />
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="600">
    <text x="38" y="43" fill="#35577a">Составной гамак 1</text>
    <text x="66" y="247" fill="#32664e">Простой гамак 2</text>
  </g>
  <g font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#182536">
    <g data-node-id="entry">
      <rect x="152" y="56" width="104" height="36" rx="6" fill="#deebfb" stroke="#586c86" />
      <text x="204" y="78" font-size="12">1</text>
    </g>
    <g data-node-id="read">
      <rect x="152" y="144" width="104" height="36" rx="6" fill="#ffffff" stroke="#586c86" />
      <text x="204" y="166" font-size="12">2</text>
    </g>
    <g data-node-id="cond">
      <rect x="152" y="260" width="104" height="36" rx="6" fill="#ffffff" stroke="#586c86" />
      <text x="204" y="282" font-size="12">3</text>
    </g>
    <g data-node-id="then">
      <rect x="220" y="348" width="104" height="36" rx="6" fill="#ffffff" stroke="#586c86" />
      <text x="272" y="370" font-size="12">4</text>
    </g>
    <g data-node-id="else">
      <rect x="84" y="348" width="104" height="36" rx="6" fill="#ffffff" stroke="#586c86" />
      <text x="136" y="370" font-size="12">5</text>
    </g>
    <g data-node-id="print">
      <rect x="152" y="464" width="104" height="36" rx="6" fill="#ffffff" stroke="#586c86" />
      <text x="204" y="486" font-size="12">6</text>
    </g>
    <g data-node-id="exit">
      <rect x="152" y="552" width="104" height="36" rx="6" fill="#deebfb" stroke="#586c86" />
      <text x="204" y="574" font-size="12">7</text>
    </g>
  </g>
</svg>
